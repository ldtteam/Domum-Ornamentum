pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven {
            url = uri('https://ldtteam.jfrog.io/artifactory/tableau/')
            name = 'Tableau'
        }
    }
}

plugins {
    id 'com.ldtteam.tableau' version '0.0.96-j21.2'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'domum-ornamentum'

features {
    usesGit = true
    usesCurse = true
    usesParchment = true
}
