tableau {
    project {
        group = "com.ldtteam"
        publisher = "LDTTeam"
        modId = "domum_ornamentum"
    }

    sourceSets {
        api {
            isPartOfPrimaryJar = true
            neogradle {
                isModSource = true
            }
        }
        main {
            dependencies {
                implementation sourceSets.named('api')
            }
        }
    }

    maven {
        publishAsLDTTeamMod()
        publishLocally()
        pom({
            usingGnu3License()
            usingGit()
        })
    }
}

sourceSets {
    test {}
    junit {}
}

runs {
    junit {
        unitTestSource project.sourceSets.junit
    }
}

dependencies {
    // Unit test dependencies for the `junit` source set.
    // Deliberately configured outside of the Tableau DSL: plain Gradle wiring avoids
    // the early-SDK-resolution conflict that hit when these were declared through Tableau.
    // Immediate (eager) addition so NeoGradle's SDK replacement runs before any configuration resolves.
    junitImplementation "net.neoforged:neoforge:${findProperty('neoforge.version')}"

    junitImplementation platform("org.junit:junit-bom:${junit_version}")
    junitImplementation "org.junit.jupiter:junit-jupiter"
    junitImplementation "org.junit.jupiter:junit-jupiter-params"
    junitRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
    junitImplementation "org.assertj:assertj-core:${assertj_version}"

    // Unit tests need to see the mod's own classes (mirrors main -> api).
    junitImplementation project.sourceSets.api.output
    junitImplementation project.sourceSets.main.output
}

tasks.named('check') {
    dependsOn tasks.named('testJunit')
}

//Porting aid: javac stops reporting at its default error cap, silently hiding further failures.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xmaxerrs', '20000'])
}